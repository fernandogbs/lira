[package]
name = "lira-stt"
version = "0.1.0"
description = "Local speech-to-text (whisper.cpp)"
license.workspace = true
edition.workspace = true

[features]
default = []
cuda = ["whisper-rs/cuda"]
openmp = ["whisper-rs/openmp"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
dirs.workspace = true
hex = "0.4"
lira-core = { path = "../core" }
log.workspace = true
num_cpus = "1.16"
