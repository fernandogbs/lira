[package]
name = "lira-core"
version = "0.1.0"
description = "Lira core: IPC, settings, i18n, state"
license.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "sync"] }
toml.workspace = true

[dev-dependencies]
tempfile = "3"
