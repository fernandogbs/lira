[package]
name = "lira-screen"
version = "0.1.0"
description = "Opt-in screen capture, OCR, and redaction"
license.workspace = true
edition.workspace = true

[dependencies]
leptess = "0.14"
log = { workspace = true }
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
