# Hyprland binds for Lira hold-to-talk (press / release).
# Source from ~/.config/hypr/hyprland.conf:
#   source = ~/path/to/lira/packaging/hyprland/lira.conf
#
# Requires [hotkey] mode = "hold" and hold_backend = "compositor" (default).

bind = SUPER, SPACE, exec, lira start
bindr = SUPER, SPACE, exec, lira stop

# Optional: cancel / toggle still available
# bind = SUPER SHIFT, SPACE, exec, lira toggle
