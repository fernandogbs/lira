[workspace]
resolver = "2"
members = [
    "crates/bench",
    "crates/core",
    "crates/audio",
    "crates/stt",
    "crates/hotkey",
    "crates/store",
    "crates/screen",
    "crates/adapters/api",
    "crates/adapters/claude-code",
    "crates/compositor",
    "crates/plugin-protocol",
    "cli",
    "app/src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
cpal = "0.15"
dirs = "6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls"] }
whisper-rs = { version = "0.16", default-features = false }
