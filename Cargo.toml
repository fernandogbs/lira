[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/audio",
    "crates/stt",
    "crates/adapters/api",
    "crates/adapters/claude-code",
    "crates/compositor",
    "crates/plugin-protocol",
    "cli",
    "app/src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
