[package]
name = "lira-cli"
version = "0.1.0"
description = "Lira CLI (toggle/start/stop/status)"
license.workspace = true
edition.workspace = true

[[bin]]
name = "lira"
path = "src/main.rs"

[[bin]]
name = "lira-hold"
path = "src/bin/lira_hold.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
evdev = "0.13"
lira-core = { path = "../crates/core" }
lira-screen = { path = "../crates/screen" }
lira-store = { path = "../crates/store" }
nix = { version = "0.29", default-features = false, features = ["fs"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
lira-core = { path = "../crates/core" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
